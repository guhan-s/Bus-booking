<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="newEmail">Email</label>
        <input id="newEmail" type="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="newPassword">Password</label>
        <input id="newPassword" type="password" placeholder="Create a password" required>
      </div>
      <button type="button" onclick="register()">Register</button>
    </form>
    <h3>Already have an account? <a href="login.html" class="button">Login here</a></h3>
  </div>

  <script>
    function register() {
      const email = document.getElementById('newEmail').value;
      const password = document.getElementById('newPassword').value;

      if (!email || !password) {
        alert("Please fill in both fields.");
        return;
      }

      fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("Registration successful! You can now log in.");
          window.location.href = 'login.html';
        } else {
          alert('Registration failed');
        }
      })
      .catch(error => {
        console.error("Error during registration request:", error);
        alert("An error occurred while trying to register.");
      });
    }
  </script>
</body>
</html>
